<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion · Miss Miracle</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body style="background: linear-gradient(135deg, #F3F0FF 0%, #EDE9FE 50%, #F5F3FF 100%); min-height: 100vh;">

  <div id="email-notif-bar-container"></div>

  <div class="auth-overlay" style="position: static; min-height: 100vh; padding: 40px 20px;">
    <div class="auth-card">
      <div class="auth-hdr">
        <div class="auth-title">Connexion</div>
        <div class="auth-sub">Accédez à votre laboratoire</div>
      </div>
      <div class="auth-group">
        <label class="auth-label">Adresse E-mail</label>
        <input class="auth-input-field" id="login-email" type="email" placeholder="nom@exemple.com" />
      </div>
      <div class="auth-group">
        <label class="auth-label">Mot de passe</label>
        <input class="auth-input-field" id="login-password" type="password" placeholder="••••••••" />
      </div>
      <button class="btn-auth-submit" id="btn-submit-login">Se connecter</button>
      <a class="auth-footer-link" id="link-goto-register">Pas encore membre ? S'inscrire</a>

      <div
        style="background:#F3F4F6; border-radius: 12px; padding:14px; font-size:11px; color:#4B5563; line-height:1.5; margin-top: 15px;">
        💡 <b>Comptes de démo :</b><br />
        • Client : <code>client@example.com</code> (mdp: <code>client123</code>)<br />
        • Admin : <code>admin@example.com</code> (mdp: <code>admin123</code>)
      </div>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script>
    // Redirect if already logged in and active
    const activeUser = getCurrentUser();
    if (activeUser) {
      if (activeUser.role === 'ADMIN' || activeUser.subscription_status === 'ACTIVE') {
        window.location.href = activeUser.role === 'ADMIN' ? 'dashboard-admin.html' : 'dashboard-client.html';
      } else {
        setCurrentUser(null);
      }
    }

    // Render simulated email bar if exists
    function renderEmailBar() {
      const sim = getSimulatedEmail();
      const container = document.getElementById("email-notif-bar-container");
      if (sim && container) {
        container.innerHTML = `
        <div class="email-notification-bar" style="position: fixed;">
          <div>
            📬 <b>[Simulateur d'Email]</b> Nouveau message pour <b>${esc(sim.email)}</b> : 
            <i>« Bienvenue chez Miss Miracle ! Définissez votre mot de passe pour activer votre espace. »</i>
          </div>
          <button class="email-btn" id="btn-activate-email" data-email="${esc(sim.email)}">Activer mon compte</button>
        </div>`;

        // Add listener
        document.getElementById("btn-activate-email")?.addEventListener("click", e => {
          const email = e.currentTarget.dataset.email;
          const pass = prompt("Définir le mot de passe pour Miss Miracle :");
          if (pass && pass.trim() !== "") {
            const clients = loadClients();
            const client = clients.find(c => c.email === email);
            if (client) {
              // Log in
              setCurrentUser(client);
              localStorage.removeItem("miracle_simulatedEmail");

              // Init chat log
              const chats = loadChats();
              if (!chats[email]) {
                chats[email] = [
                  { sender: "support", text: `Bienvenue chez Miss Miracle Cosmetics, ${client.first_name} ! Comment puis-je vous aider aujourd'hui ?`, time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) }
                ];
                saveChats(chats);
              }

              alert(`Bienvenue, ${client.first_name} ! Votre compte est activé.`);
              window.location.href = "dashboard-client.html";
            }
          }
        });
      }
    }
    renderEmailBar();

    // Login logic
    document.getElementById("btn-submit-login")?.addEventListener("click", () => {
      const email = document.getElementById("login-email")?.value.trim();
      const pass = document.getElementById("login-password")?.value.trim();

      if (!email || !pass) {
        showToast("⚠️ Saisir votre e-mail et votre mot de passe");
        return;
      }

      // Demo Client login
      if (email === "client@example.com" && pass === "client123") {
        const clients = loadClients();
        let client = clients.find(c => c.email === "awa.diop@example.com");
        if (!client) {
          client = { first_name: "Awa", last_name: "Diop", email: "awa.diop@example.com", phone: "+221 77 123 45 67", role: "CLIENT", subscription_status: "ACTIVE" };
        }
        setCurrentUser(client);
        window.location.href = "dashboard-client.html";
        return;
      }

      // Demo Admin login
      if (email === "admin@example.com" && pass === "admin123") {
        setCurrentUser({ first_name: "Astou", last_name: "Ndiaye (MM)", email: "admin@example.com", role: "ADMIN", subscription_status: "ACTIVE" });
        window.location.href = "dashboard-client.html"; // Lands on client workspace first, can toggle admin console in sidebar
        return;
      }

      // General Client login check in our client base
      const clients = loadClients();
      const found = clients.find(c => c.email.toLowerCase() === email.toLowerCase());
      if (found) {
        if (found.subscription_status !== "ACTIVE") {
          showToast("❌ Votre abonnement est expiré ou inactif. Contactez le support.");
          return;
        }
        setCurrentUser(found);
        window.location.href = "dashboard-client.html";
      } else {
        showToast("❌ Identifiants invalides ou utilisateur inconnu");
      }
    });

    document.getElementById("link-goto-register")?.addEventListener("click", () => { window.location.href = "register.html"; });
  </script>
</body>

</html>
