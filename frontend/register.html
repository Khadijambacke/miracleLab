<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer mon compte · Miss Miracle</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #F3F0FF 0%, #EDE9FE 50%, #F5F3FF 100%); min-height: 100vh;">

  <div class="auth-overlay" style="position: static; min-height: 100vh; padding: 40px 20px;">
    <div class="auth-card">
      <div class="auth-hdr">
        <div class="auth-title">Créer mon compte</div>
        <div class="auth-sub">Entrez vos coordonnées pour accéder au Miracle Lab</div>
      </div>
      <div class="auth-grid-2">
        <div class="auth-group">
          <label class="auth-label">Prénom</label>
          <input class="auth-input-field" id="reg-firstname" type="text" placeholder="Prénom"/>
        </div>
        <div class="auth-group">
          <label class="auth-label">Nom</label>
          <input class="auth-input-field" id="reg-lastname" type="text" placeholder="Nom"/>
        </div>
      </div>
      <div class="auth-group">
        <label class="auth-label">Adresse E-mail</label>
        <input class="auth-input-field" id="reg-email" type="email" placeholder="nom@exemple.com"/>
      </div>
      <div class="auth-group">
        <label class="auth-label">Téléphone</label>
        <input class="auth-input-field" id="reg-phone" type="tel" placeholder="+221 77 123 45 67"/>
      </div>
      <button class="btn-auth-submit" id="btn-submit-register">Procéder au paiement (15 000 FCFA)</button>
      <a class="auth-footer-link" id="link-goto-login">Déjà inscrit ? Se connecter</a>
    </div>
  </div>

  <script src="js/shared.js"></script>
  <script>
    document.getElementById("btn-submit-register")?.addEventListener("click", () => {
      const firstName = document.getElementById("reg-firstname")?.value.trim();
      const lastName = document.getElementById("reg-lastname")?.value.trim();
      const email = document.getElementById("reg-email")?.value.trim();
      const phone = document.getElementById("reg-phone")?.value.trim();

      if (!firstName || !lastName || !email) {
        showToast("⚠️ Veuillez remplir les champs obligatoires (Prénom, Nom, Email)");
        return;
      }

      // Save to localStorage temporary registration slot
      const regObj = { first_name: firstName, last_name: lastName, email: email, phone: phone };
      localStorage.setItem("miracle_temp_reg", JSON.stringify(regObj));
      window.location.href = "payment.html";
    });

    document.getElementById("link-goto-login")?.addEventListener("click", () => { window.location.href = "login.html"; });
  </script>
</body>
</html>
