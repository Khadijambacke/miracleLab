version: '3.8'

services:
  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: missmiracle_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./Backend:/var/www/html
    networks:
      - missmiracle-network

  web:
    image: nginx:alpine
    container_name: missmiracle_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - missmiracle-network

  # Base de données MySQL pour la production (Optionnelle si vous utilisez SQLite)
  db:
    image: mysql:8.0
    container_name: missmiracle_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: missmiracle_prod
      MYSQL_USER: missuser
      MYSQL_PASSWORD: MissMiracleSecretPassword2026!
      MYSQL_ROOT_PASSWORD: RootSecretPassword2026!
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - missmiracle-network

volumes:
  dbdata:
    driver: local

networks:
  missmiracle-network:
    driver: bridge
